databases:
  - name: afrfms-db
    plan: basic-256mb
    databaseName: afrfms
    user: afrfms

services:
  - type: web
    name: afrfms-backend
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: DB_DRIVER
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: afrfms-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      # Update this once you know your frontend's actual URL if Render
      # had to rename it (e.g. afrfms-web-xyz1.onrender.com).
      - key: FRONTEND_URL
        value: https://afrfms-web.onrender.com

  - type: web
    name: afrfms-web
    runtime: static
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Update this once you know your backend's actual URL if Render
      # had to rename it (e.g. afrfms-backend-xyz1.onrender.com).
      - key: VITE_API_URL
        value: https://afrfms-backend.onrender.com
    routes:
      # React Router uses client-side routing — without this, refreshing
      # any page other than "/" returns a 404 from the static host.
      - type: rewrite
        source: /*
        destination: /index.html
